<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 Dota Picker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/lobby">⚔️ A5 Dota Picker</a>

      <a href="#/ideen" data-nav="ideen">Ideen</a>
      <a href="#/spieler" data-nav="spieler">Spieler</a>
      <a href="#/admin" data-nav="admin">Admin</a>
    </nav>
    <span class="spacer"></span>

  <datalist id="hero-list"></datalist>

  <script src="data/config.js"></script>

  <script src="js/app.js"></script>

</html>
